server {
    listen 8080;
    server_name _;
    root /sites;
    client_max_body_size 50m;
    location /assets/ { try_files $uri =404; expires 1d; }
    location ~ ^/files/(.*) { try_files /${SITE_NAME}/public/files/$1 =404; }
    location ~ ^/protected/(.*)$ { internal; try_files /$1 =404; }
    location ~ ^/private/ { return 403; }
    location /socket.io {
        proxy_pass http://websocket:9000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Frappe-Site-Name ${SITE_NAME};
    }
    location / {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Frappe-Site-Name ${SITE_NAME};
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
    }
}
